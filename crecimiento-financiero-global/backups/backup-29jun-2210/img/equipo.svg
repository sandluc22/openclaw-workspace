<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#eff6ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  
  <!-- Mesa -->
  <rect x="60" y="170" width="280" height="12" rx="4" fill="#94a3b8" opacity="0.6"/>
  
  <!-- Persona 1 (izquierda) -->
  <circle cx="130" cy="100" r="22" fill="#3b82f6" opacity="0.8"/>
  <rect x="108" y="122" width="44" height="50" rx="8" fill="#60a5fa" opacity="0.8"/>
  <rect x="105" y="140" width="18" height="40" rx="6" fill="#3b82f6" opacity="0.6"/>
  <rect x="137" y="140" width="18" height="40" rx="6" fill="#3b82f6" opacity="0.6"/>
  
  <!-- Persona 2 (centro) -->
  <circle cx="200" cy="90" r="24" fill="#2563eb" opacity="0.85"/>
  <rect x="176" y="114" width="48" height="58" rx="8" fill="#3b82f6" opacity="0.85"/>
  <rect x="173" y="135" width="20" height="45" rx="6" fill="#2563eb" opacity="0.7"/>
  <rect x="207" y="135" width="20" height="45" rx="6" fill="#2563eb" opacity="0.7"/>
  
  <!-- Persona 3 (derecha) -->
  <circle cx="270" cy="100" r="22" fill="#3b82f6" opacity="0.8"/>
  <rect x="248" y="122" width="44" height="50" rx="8" fill="#60a5fa" opacity="0.8"/>
  <rect x="245" y="140" width="18" height="40" rx="6" fill="#3b82f6" opacity="0.6"/>
  <rect x="277" y="140" width="18" height="40" rx="6" fill="#3b82f6" opacity="0.6"/>
  
  <!-- Portátil centro -->
  <rect x="158" y="148" width="84" height="8" rx="3" fill="#475569"/>
  <rect x="165" y="148" width="70" height="22" rx="3" fill="#1e293b"/>
  <rect x="170" y="150" width="60" height="16" rx="2" fill="#334155"/>
  <line x1="175" y1="156" x2="225" y2="156" stroke="#475569" stroke-width="1.5"/>
  <line x1="175" y1="160" x2="210" y2="160" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Burbujas de diálogo -->
  <ellipse cx="100" cy="50" rx="35" ry="16" fill="white" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="100" y="54" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">💡</text>
  
  <ellipse cx="300" cy="55" rx="35" ry="16" fill="white" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="300" y="59" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">📊</text>
  
  <ellipse cx="200" cy="38" rx="40" ry="18" fill="white" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="200" y="43" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">🤝</text>

  <!-- Icono colaboración abajo -->
  <text x="200" y="260" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="bold">EQUIPO</text>
  <text x="200" y="278" text-anchor="middle" fill="#6b7280" font-size="11">colaboradores de Grupo Galilea</text>
</svg>
